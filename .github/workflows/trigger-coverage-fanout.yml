name: Trigger Coverage Fan-out

# After a PR merges to main and touched JDBC driver source, dispatch a
# `coverage-fanout` repository_dispatch to databricks/databricks-driver-test.
# Its coverage-fanout-tracker.yml then opens a tracking issue and runs the
# language-agnostic multi-language coverage fan-out: a spec is authored from
# THIS PR's diff, then conformed as tests across every driver (csharp / python /
# go / nodejs / rust / kernel / jdbc) as peco-engineer-bot.
#
# This mirrors the sender that adbc-drivers/databricks and the databricks-sql-*
# connectors run. It is a standalone workflow (databricks-jdbc has no shared
# trigger-integration-tests.yml to append to).
#
# Required external setup (one-time, admin):
#   1. `INTEGRATION_TEST_APP_ID` / `INTEGRATION_TEST_PRIVATE_KEY` repo secrets are
#      installed here for the dispatcher GitHub App (the same App the other driver
#      repos use). Until these exist, the token step below fails and NO dispatch
#      is sent — the workflow is otherwise inert (docs/CI/test-only merges are
#      already filtered out).
#   2. The App is installed on databricks-driver-test so this can send
#      repository_dispatch there.

on:
  pull_request:
    types: [closed]

jobs:
  trigger-coverage-fanout:
    if: |
      github.event.pull_request.merged == true
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - name: Check if JDBC driver source changed
        id: changed
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // The whole repo IS the JDBC driver. Count a merge as source-affecting
            // when it changes a main (non-test) Java/resources source file under
            // src/main/. Docs/CI/test-only merges (src/test/, docs/, .github/, poms)
            // do not warrant a full multi-language fan-out.
            const isSource = (f) => f.startsWith('src/main/');
            const srcChanged = files.some((f) => isSource(f.filename));
            console.log(`JDBC driver source changed: ${srcChanged}`);
            core.setOutput('source', srcChanged.toString());

      - name: Generate GitHub App token (databricks-driver-test)
        if: steps.changed.outputs.source == 'true'
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.INTEGRATION_TEST_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_TEST_PRIVATE_KEY }}
          owner: databricks
          repositories: databricks-driver-test

      - name: Dispatch coverage-fanout
        if: steps.changed.outputs.source == 'true'
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: databricks/databricks-driver-test
          event-type: coverage-fanout
          client-payload: '{"reference_repo": "${{ github.repository }}", "pr_number": "${{ github.event.pull_request.number }}", "pr_url": "${{ github.event.pull_request.html_url }}"}'
