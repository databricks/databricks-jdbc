# Engineer Bot — follow-up.
#
# When someone replies to a review thread on a PR carrying the `engineer-bot`
# label (or the label is applied), the bot re-evaluates the open threads in
# catch-up mode, applies a fixup (or replies / marks blocked), and pushes to the
# PR branch. Driven by this repo's .bot/ prompts.
#
# Like the author, this sets up Java 21 + Maven (via setup-maven → JFrog mirror)
# so the agent can run the mocked unit suite (`mvn -pl jdbc-core test`) to verify
# a fixup. Unlike the author it wires NO live-warehouse env — the follow-up prompt
# runs only unit tests and forbids the live e2e suite. Same spotless-churn revert
# + credential-scrub as the author (see comments there).
#
# The gate below is the canonical label-gated form from the engine dogfood. It
# ANDs with the engine-side floor; do not weaken it.
name: Engineer Bot — Follow-up

on:
  pull_request_review_comment:
    types: [created]
  # `engineer-bot` label applied → catch-up over pre-existing review threads.
  pull_request:
    types: [labeled]

permissions:
  contents: write        # push fixup commits to the PR branch
  pull-requests: write   # post inline replies
  id-token: write        # JFrog OIDC (Maven mirror) + the engine/SDK/CLI install

jobs:
  followup:
    # SECURITY + scope (CANONICAL label-gated model — verbatim from the engine):
    #  - skip fork PRs — keep the model + App token out of untrusted code's reach
    #    (critical on a PUBLIC repo);
    #  - operate only on non-fork OPEN PRs carrying the `engineer-bot` label
    #    (maintainer-applied opt-in; label requires triage+);
    #  - comment path: trusted commenters only
    #    (OWNER/MEMBER/COLLABORATOR/CONTRIBUTOR, or a bot — reviewer-bot/Copilot),
    #    never the engineer-bot's own comments, and never a reviewer-bot reconcile
    #    loopback. CONTRIBUTOR is included because a maintainer with PRIVATE org
    #    membership is reported as `author_association: CONTRIBUTOR` in the webhook
    #    payload (even though REST shows MEMBER) — without it, such a maintainer's
    #    review comments SILENTLY fail this gate and the bot never engages. Low
    #    risk: this path already requires a non-fork, OPEN, `engineer-bot`-labeled
    #    PR (a maintainer-applied opt-in);
    #  - labeled path: the `engineer-bot` label was just applied by a human.
    if: >-
      github.event.pull_request.head.repo.fork == false
      && github.event.pull_request.state == 'open'
      && (
        (
          github.event_name == 'pull_request_review_comment'
          && contains(github.event.pull_request.labels.*.name, 'engineer-bot')
          && !startsWith(github.event.comment.user.login, 'peco-engineer-bot')
          && !contains(github.event.comment.body, '<!-- pr-review-bot:v1 reconcile -->')
          && (
            contains(fromJson('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association)
            || (
              github.event.comment.user.type == 'Bot'
              && (
                startsWith(github.event.comment.user.login, 'peco-review-bot')
                || startsWith(github.event.comment.user.login, 'Copilot')
                || startsWith(github.event.comment.user.login, 'copilot')
              )
            )
          )
        )
        || (
          github.event_name == 'pull_request'
          && github.event.action == 'labeled'
          && github.event.label.name == 'engineer-bot'
          && github.event.sender.type != 'Bot'
          && !startsWith(github.event.sender.login, 'peco-engineer-bot')
        )
      )
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: engineer-bot-followup-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Checkout FIRST (remote action) so the local `./` composites resolve. Check
      # out the PR head BRANCH (not the merge ref) so fixups push back to it.
      # persist-credentials:false; the run step sets an authenticated push remote.
      - name: Checkout PR head branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      # --- Java + Maven toolchain (mirrors prCheck.yml; see engineer-bot.yml) ---
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          java-version: 21
          distribution: 'adopt'

      - name: Setup Maven (JFrog mirror via OIDC)
        uses: ./.github/actions/setup-maven
        with:
          is-fork: 'false'

      - name: Build driver (skip tests; warms the Maven repo + compiles jdbc-core)
        run: mvn -pl jdbc-core -am -B clean install -DskipTests -Ddependency-check.skip=true

      # Resolve test tooling with credentials; run PR tests only after scrubbing.
      - name: Warm test dependencies for the offline agent
        id: warm-maven
        run: |
          set -euo pipefail
          mvn -pl jdbc-core -B dependency:resolve dependency:resolve-plugins \
            -Ddependency-check.skip=true \
            || echo "::warning::Maven dependency warm-up failed; continuing with the available cache."
          # Surefire's JUnit provider is resolved lazily, so fetch it explicitly.
          SUREFIRE_VERSION=$(mvn -pl jdbc-core -B help:evaluate \
            -Dexpression=maven-surefire-plugin.version -q -DforceStdout 2>/dev/null \
            | tail -n1) || SUREFIRE_VERSION=""
          if [[ ! "$SUREFIRE_VERSION" =~ ^[[:alnum:]][[:alnum:]._-]*$ ]]; then
            echo "::warning::Could not determine the Surefire version; using 3.1.2."
            SUREFIRE_VERSION="3.1.2"
          fi
          SUREFIRE_PROVIDER="org.apache.maven.surefire:surefire-junit-platform:${SUREFIRE_VERSION}"
          echo "surefire-provider=${SUREFIRE_PROVIDER}" >> "$GITHUB_OUTPUT"
          mvn -B dependency:get -Dartifact="${SUREFIRE_PROVIDER}" \
            || echo "::warning::Surefire provider warm-up failed; continuing with the available cache."
          # Surefire aligns its launcher with the project's resolved Platform engine.
          JUNIT_PLATFORM_VERSION=$(mvn -pl jdbc-core -B dependency:list \
            -DincludeGroupIds=org.junit.platform -DincludeArtifactIds=junit-platform-engine \
            | sed -n 's/.*org\.junit\.platform:junit-platform-engine:jar:\([^: ]*\):.*/\1/p') \
            || JUNIT_PLATFORM_VERSION=""
          JUNIT_LAUNCHER=""
          if [[ "$JUNIT_PLATFORM_VERSION" =~ ^[[:digit:]][[:alnum:]._-]*$ ]]; then
            JUNIT_LAUNCHER="org.junit.platform:junit-platform-launcher:${JUNIT_PLATFORM_VERSION}"
            mvn -B dependency:get -Dartifact="${JUNIT_LAUNCHER}" \
              || echo "::warning::JUnit Platform launcher warm-up failed; continuing with the available cache."
          else
            echo "::warning::Could not determine the resolved JUnit Platform engine version; launcher warm-up skipped."
          fi
          echo "junit-launcher=${JUNIT_LAUNCHER}" >> "$GITHUB_OUTPUT"

      # Empty offline settings use central, not the JFrog mirror's repository ID.
      - name: Normalize _remote.repositories for offline resolution
        run: |
          set -euo pipefail
          find ~/.m2/repository -name '_remote.repositories' \
            -exec sed -i 's/jfrog-central/central/g' {} +

      # --- shared bot setup ----------------------------------------------------
      - name: Bot prelude (tokens + Node + engine install)
        id: prelude
        uses: ./.github/actions/bot-prelude
        with:
          app-id: ${{ secrets.ENGINEER_BOT_APP_ID }}
          private-key: ${{ secrets.ENGINEER_BOT_APP_PRIVATE_KEY }}

      # Scope the JFrog Maven credential away from the model-driven followup step:
      # the build consumed it, and the agent's `mvn test` runs offline from the
      # warmed ~/.m2 repo. (See engineer-bot.yml for the full rationale.)
      - name: Scrub JFrog credentials before the agent runs
        run: |
          echo "JFROG_ACCESS_TOKEN=" >> "$GITHUB_ENV"
          mkdir -p ~/.m2
          printf '<settings />\n' > ~/.m2/settings.xml
          echo "MAVEN_ARGS=-o" >> "$GITHUB_ENV"

      - name: Check Maven dependency and plugin resolution offline
        env:
          SUREFIRE_PROVIDER: ${{ steps.warm-maven.outputs.surefire-provider }}
          JUNIT_LAUNCHER: ${{ steps.warm-maven.outputs.junit-launcher }}
        run: |
          set -euo pipefail
          mvn -o -pl jdbc-core -B dependency:resolve dependency:resolve-plugins \
            -Ddependency-check.skip=true \
            || echo "::warning::Some Maven dependencies or plugins are unavailable offline; the follow-up agent will report verification limits."
          mvn -o -B dependency:get -Dartifact="${SUREFIRE_PROVIDER}" \
            || echo "::warning::The Surefire provider or its dependencies are unavailable offline; the follow-up agent will report verification limits."
          if [[ -n "$JUNIT_LAUNCHER" ]]; then
            mvn -o -B dependency:get -Dartifact="${JUNIT_LAUNCHER}" \
              || echo "::warning::The JUnit Platform launcher is unavailable offline; the follow-up agent will report verification limits."
          fi

      - name: Warm test runtime offline
        run: |
          mvn -o -pl jdbc-core -B test \
            -Dtest="DatabricksParameterMetaDataTest#testInitialization" \
            -Ddependency-check.skip=true \
            || echo "::warning::The offline smoke test could not complete (missing or failing test, compilation error, or cache miss); continuing so the follow-up agent can investigate."

      # The build and smoke test apply Spotless; restore files before agent edits.
      - name: Revert spotless churn (keep only the agent's edits)
        run: git checkout -- .

      # Run the follow-up. NOTE: no live-warehouse connection env
      # (DATABRICKS_HOST / _HTTP_PATH / _TEST_CONFIG_FILE) is wired here — the
      # followup prompt runs only the mocked unit suite and forbids live e2e, so
      # the agent never needs them.
      - name: Run engineer follow-up (catch-up over all unaddressed threads)
        env:
          GH_TOKEN: ${{ steps.prelude.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          ENGINEER_BOT_MODEL_OVERRIDE: databricks-claude-opus-5-5
          MODEL_ENDPOINT: https://${{ secrets.DATABRICKS_HOST }}/serving-endpoints/databricks-claude-opus-5-5/invocations
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          RUNNER_TEMP: ${{ runner.temp }}
          # The agent's working tree AND the .bot/ lookup root. run.py resolves the
          # config at <REPO_ROOT>/.bot/config.yaml. The engine has NO path default —
          # it fails with a clear error if this is unset.
          REPO_ROOT: ${{ github.workspace }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python -m databricks_bot_engine.engineer_bot.run --phase followup \
            --system-prompt "$GITHUB_WORKSPACE/.bot/prompts/engineer-followup/system.md"
