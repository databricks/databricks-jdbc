name: Security Scan

# Single workflow, single job. Triggered three ways:
#
#   - pull_request to main: fail the job on any unsuppressed CVSS >= 7
#     finding. Not yet required-to-merge in branch protection.
#   - cron (weekly): same scan; on findings, send the existing email
#     notification and fail the job.
#   - workflow_dispatch: behaves like the cron run (sends email).
#
# Two scanners run on every invocation:
#
#   - OWASP dependency-check (NVD CPE-based). Reuses owasp-suppressions.xml
#     and the <failBuildOnCVSS>7</failBuildOnCVSS> threshold from
#     jdbc-core/pom.xml. The maven plugin exits non-zero on findings, so
#     continue-on-error is set on that step; the explicit findings step
#     below is what decides whether to alert.
#
#   - OSV-Scanner v2.3.8 (purl-based via OSV.dev; federates
#     GHSA/NVD/PyPA/RustSec). Catches advisories with no NVD CPE entry --
#     e.g. CVE-2025-66566 in at.yawk.lz4:lz4-java and CVE-2026-5598 in
#     bouncycastle, both invisible to OWASP. Reads the cyclonedx aggregate
#     SBOM produced by `mvn package` so it sees the actually-resolved
#     local dependency tree.
#
# Suppression files (keep in sync):
#
#   - owasp-suppressions.xml -- consumed by OWASP.
#   - osv-scanner.toml       -- consumed by OSV.
#
# Both files have justification comments per entry.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Run every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # Cache OWASP's NVD vulnerability database (~150 MB of CVE feeds).
      # Without this, dependency-check downloads it fresh on every run,
      # which adds ~2 minutes. The restore-key prefix means we always
      # restore the most recent cache; OWASP itself decides whether to
      # incrementally update the data on top (default: every 4 hours), so
      # we get fresh CVE data without paying the full download each time.
      - name: Compute NVD cache key
        id: nvd-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache NVD database
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ steps.nvd-key.outputs.date }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # JFrog OIDC + maven proxy. Skipped on fork PRs (no OIDC token); the
      # build will fall through to Maven Central directly, which is slower
      # but still works for read-only resolution.
      - name: Get JFrog OIDC token
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail

          ID_TOKEN=$(curl -sLS \
            -H "User-Agent: actions/oidc-client" \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jfrog-github" | jq .value | tr -d '"')
          echo "::add-mask::${ID_TOKEN}"

          ACCESS_TOKEN=$(curl -sLS -XPOST -H "Content-Type: application/json" \
            "https://databricks.jfrog.io/access/api/v1/oidc/token" \
            -d "{\"grant_type\": \"urn:ietf:params:oauth:grant-type:token-exchange\", \"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\", \"subject_token\": \"${ID_TOKEN}\", \"provider_name\": \"github-actions\"}" | jq .access_token | tr -d '"')
          echo "::add-mask::${ACCESS_TOKEN}"

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "FAIL: Could not extract JFrog access token"
            exit 1
          fi

          echo "JFROG_ACCESS_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"

      - name: Configure maven
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <mirrors>
              <mirror>
                <id>jfrog-central</id>
                <mirrorOf>*</mirrorOf>
                <url>https://databricks.jfrog.io/artifactory/db-maven/</url>
              </mirror>
            </mirrors>
            <servers>
              <server>
                <id>jfrog-central</id>
                <username>gha-service-account</username>
                <password>${JFROG_ACCESS_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      # Build the project to produce the cyclonedx aggregate SBOM that OSV
      # will scan. -Ddependency-check.skip=true because OWASP runs as its
      # own explicit step below.
      - name: Build (generates cyclonedx SBOM)
        run: mvn package -DskipTests -Ddependency-check.skip=true -B

      - name: Run OWASP Dependency Check
        # failBuildOnCVSS=7 in jdbc-core/pom.xml makes this step exit
        # non-zero on findings. Let it pass; the findings step below
        # decides whether to alert (and is the single source of truth for
        # both PR-fail and weekly-email branches).
        continue-on-error: true
        run: |
          mvn -pl jdbc-core org.owasp:dependency-check-maven:check \
            -Dnvd.api.key=${{ secrets.NVD_API_KEY }}

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.8/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner --version

      - name: Run OSV-Scanner
        run: |
          set -uo pipefail
          /tmp/osv-scanner scan source \
            --recursive=false \
            --config=osv-scanner.toml \
            --format=json \
            --output-file=/tmp/osv-out.json \
            target/bom.json || true

      # Single source of truth for "are there findings?". Combines OWASP's
      # HTML report (grep) and OSV's JSON (jq, filtered to CVSS >= 7).
      # Sets job outputs that the terminal steps below consume.
      - name: Collect findings
        id: findings
        run: |
          set -uo pipefail

          # --- OWASP findings ---
          # Read the JSON report directly. Suppressed CVEs are omitted from
          # the report by OWASP itself, so this counts only real findings.
          OWASP_COUNT=0
          if [ -f jdbc-core/target/dependency-check-report.json ]; then
            OWASP_COUNT=$(jq '[
              .dependencies[]? |
              .vulnerabilities[]? |
              select((.cvssv3.baseScore // .cvssv2.score // 0) >= 7)
            ] | length' jdbc-core/target/dependency-check-report.json)
          fi
          OWASP_HIGH=false
          if [ "$OWASP_COUNT" -gt 0 ]; then
            OWASP_HIGH=true
          fi

          # --- OSV findings (filter to CVSS >= 7) ---
          OSV_HIGH_JSON='[]'
          if [ -f /tmp/osv-out.json ]; then
            OSV_HIGH_JSON=$(jq -c '[
              .results[].packages[]? |
              .package as $pkg |
              .groups[]? |
              select((.max_severity | tonumber? // 0) >= 7) |
              {pkg: ($pkg.name + "@" + $pkg.version), ids: .ids, severity: .max_severity}
            ]' /tmp/osv-out.json)
          fi
          OSV_COUNT=$(echo "$OSV_HIGH_JSON" | jq 'length')
          OSV_HIGH=false
          if [ "$OSV_COUNT" -gt 0 ]; then
            OSV_HIGH=true
          fi

          # --- Combined verdict ---
          HAS_FINDINGS=false
          if [ "$OWASP_HIGH" = "true" ] || [ "$OSV_HIGH" = "true" ]; then
            HAS_FINDINGS=true
          fi

          echo "owasp_count=$OWASP_COUNT" >> "$GITHUB_OUTPUT"
          echo "osv_count=$OSV_COUNT" >> "$GITHUB_OUTPUT"
          echo "has_findings=$HAS_FINDINGS" >> "$GITHUB_OUTPUT"

          # Log to job summary so it's visible without downloading artifacts.
          {
            echo "## Security Scan Findings"
            echo ""
            echo "- OWASP CVSS>=7 findings: \`$OWASP_COUNT\` (see uploaded HTML report for details)"
            echo "- OSV CVSS>=7 findings: \`$OSV_COUNT\`"
            if [ "$OSV_COUNT" -gt 0 ]; then
              echo ""
              echo "OSV findings:"
              echo "$OSV_HIGH_JSON" | jq -r '.[] | "- \(.pkg) | \(.ids | join(",")) | severity \(.severity)"'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$HAS_FINDINGS" = "true" ]; then
            echo "::warning::Unsuppressed CVSS>=7 findings detected. See job summary."
          else
            echo "No unsuppressed CVSS>=7 findings."
          fi

      # --- Terminal: PR event ---
      # Fail the job so the PR's check goes red. No email; reviewers see
      # the ❌ in the PR conversation and dig into the artifacts/summary.
      - name: Fail on findings (PR)
        if: github.event_name == 'pull_request' && steps.findings.outputs.has_findings == 'true'
        run: |
          echo "::error::Unsuppressed CVSS>=7 finding(s) in this PR."
          echo ""
          echo "Fix by either:"
          echo "  1. Bumping the affected dependency to a patched version, or"
          echo "  2. Adding a documented suppression entry to BOTH"
          echo "     owasp-suppressions.xml AND osv-scanner.toml (keep them in sync)."
          exit 1

      # --- Terminal: scheduled/manual event ---
      # On the weekly cron (and manual workflow_dispatch reruns), send the
      # existing email notification and fail the job. Uses the same SMTP
      # secrets as the old vulnerabilityCatcher.yml.
      - name: Compose email body
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.findings.outputs.has_findings == 'true'
        run: |
          {
            echo "<!DOCTYPE html><html><head><title>JDBC Driver Security Scan Results</title></head><body>"
            echo "<h1>Security Vulnerabilities Found</h1>"
            echo "<p>Unsuppressed CVSS &gt;= 7 finding(s) detected in the weekly scan of the JDBC driver.</p>"
            echo "<ul>"
            echo "  <li>OWASP findings: ${{ steps.findings.outputs.owasp_count }}</li>"
            echo "  <li>OSV findings: ${{ steps.findings.outputs.osv_count }}</li>"
            echo "</ul>"
            echo "<p>Full reports are attached to the GitHub Actions run as artifacts: <a href='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View Artifacts</a></p>"
            echo "</body></html>"
          } > security-scan-report.html

      - name: Send Email
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.findings.outputs.has_findings == 'true'
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: OSS JDBC Driver Security Scan - 🚨 Vulnerabilities Found
          html_body: file://security-scan-report.html
          to: ${{ secrets.EMAIL_RECIPIENTS }}
          from: JDBC Security Scanner
          content_type: text/html

      - name: Fail on findings (scheduled/manual)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.findings.outputs.has_findings == 'true'
        run: |
          echo "::error::Unsuppressed CVSS>=7 finding(s) on main. Email sent."
          exit 1

      # Always upload artifacts so triagers can pull the full reports
      # without having to rerun anything.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-scan-reports
          path: |
            jdbc-core/target/dependency-check-report.html
            jdbc-core/target/dependency-check-report.json
            /tmp/osv-out.json
            target/bom.json
            security-scan-report.html
          if-no-files-found: ignore
