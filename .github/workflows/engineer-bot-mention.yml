name: Engineer Bot — Mention

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request
      && github.event.issue.state == 'open'
      && (startsWith(github.event.comment.body, '@bot ')
        || startsWith(github.event.comment.body, fromJson('"@bot\n"'))
        || startsWith(github.event.comment.body, fromJson('"@bot\r"'))
        || github.event.comment.body == '@bot')
      && github.event.comment.user.type == 'User'
      && !contains(github.event.comment.body, '<!-- engineer-bot-jdbc:')
      && contains(fromJson('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association)
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.pr.outputs.eligible }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
    steps:
      # Check permissions before requesting the environment's App/model secrets.
      - name: Verify commenter has write access
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          if ! permission=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq '.permission'); then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping @bot request: could not verify commenter write access."
            exit 0
          fi
          case "$permission" in
            write|maintain|admin) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping @bot request: commenter must have write access or higher."
              ;;
          esac

      - name: Resolve PR branch
        id: pr
        if: steps.permission.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$REPO" '.state == "open" and .head.repo.full_name == $repo' <<< "$pr" >/dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Only open PRs with a branch in this repository are supported."
            exit 0
          fi
          {
            echo "eligible=true"
            echo "head_ref=$(jq -r '.head.ref' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

  mention:
    needs: authorize
    if: needs.authorize.outputs.eligible == 'true'
    environment: azure-prod
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      # Share the branch-editing queue with engineer-bot-followup.yml.
      group: engineer-bot-followup-pr-${{ github.event.issue.number }}
      cancel-in-progress: false
      # Keep up to 100 pending requests in the shared queue.
      queue: max
    steps:
      # Load actions, config, and prompts from the default branch.
      - name: Checkout bot setup
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520  # v5.4.0
        with:
          java-version: 21
          distribution: 'adopt'

      - name: Setup Maven (JFrog mirror via OIDC)
        uses: ./.github/actions/setup-maven
        with:
          is-fork: 'false'

      - name: Build trusted driver (skip tests; warm the Maven repo)
        run: mvn -pl jdbc-core -am -B clean install -DskipTests -Ddependency-check.skip=true

      # Resolve test tooling while only the default branch is checked out.
      - name: Warm test dependencies for the offline agent
        timeout-minutes: 5
        continue-on-error: true
        run: |
          set -euo pipefail
          SUREFIRE_VERSION=$(mvn -pl jdbc-core -B help:evaluate \
            -Dexpression=maven-surefire-plugin.version -q -DforceStdout) || SUREFIRE_VERSION=""
          # Use the same pinned fallback as engineer-bot.yml.
          SUREFIRE_VERSION=${SUREFIRE_VERSION:-3.1.2}
          # Surefire aligns its launcher with the project's resolved Platform engine.
          JUNIT_PLATFORM_VERSION=$(mvn -pl jdbc-core -B dependency:list \
            -DincludeGroupIds=org.junit.platform -DincludeArtifactIds=junit-platform-engine \
            | sed -n 's/.*org\.junit\.platform:junit-platform-engine:jar:\([^: ]*\):.*/\1/p') || JUNIT_PLATFORM_VERSION=""
          mvn -N -B dependency:get \
            -Dartifact="org.apache.maven.surefire:surefire-junit-platform:${SUREFIRE_VERSION}" \
            || echo "::warning::Surefire provider warm-up failed; offline Maven tests may fail."
          if [[ -n "$JUNIT_PLATFORM_VERSION" ]]; then
            mvn -N -B dependency:get \
              -Dartifact="org.junit.platform:junit-platform-launcher:${JUNIT_PLATFORM_VERSION}" \
              || echo "::warning::JUnit Platform launcher warm-up failed; offline Maven tests may fail."
          else
            echo "::warning::JUnit Platform version lookup failed; launcher warm-up skipped."
          fi

      # Empty offline settings use central, not the JFrog mirror's repository ID.
      - name: Normalize _remote.repositories for offline resolution
        run: |
          set -euo pipefail
          find ~/.m2/repository -name '_remote.repositories' \
            -exec sed -i 's/jfrog-central/central/g' {} +

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Bot prelude
        id: prelude
        uses: ./.github/actions/bot-prelude
        with:
          app-id: ${{ secrets.ENGINEER_BOT_APP_ID }}
          private-key: ${{ secrets.ENGINEER_BOT_APP_PRIVATE_KEY }}

      - name: Scrub JFrog credentials before the agent runs
        run: |
          rm -f ~/.npmrc
          echo "JFROG_ACCESS_TOKEN=" >> "$GITHUB_ENV"
          mkdir -p ~/.m2
          printf '<settings />\n' > ~/.m2/settings.xml
          echo "MAVEN_ARGS=-o" >> "$GITHUB_ENV"

      - name: Check trusted unit tests work offline
        timeout-minutes: 2
        continue-on-error: true
        run: |
          mvn -o -pl jdbc-core -B test \
            -Dtest="DatabricksParameterMetaDataTest#testInitialization" \
            -Ddependency-check.skip=true \
            || echo "::warning::The offline smoke test failed; see the Maven output for the cause."

      - name: Restore trusted sources after Spotless
        run: git restore --source=HEAD --worktree -- .

      - name: Recheck PR eligibility
        id: pr
        env:
          GH_TOKEN: ${{ steps.prelude.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_REF: ${{ needs.authorize.outputs.head_ref }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$REPO" --arg ref "$HEAD_REF" \
            '.state == "open" and .head.repo.full_name == $repo and .head.ref == $ref' <<< "$pr" >/dev/null; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping @bot request: PR is closed or its source branch changed."
            exit 0
          fi
          {
            echo "eligible=true"
            echo "base_sha=$(jq -r '.base.sha' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.head_ref }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare PR diff reference
        if: steps.pr.outputs.eligible == 'true'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git -C pr rev-parse HEAD)
          export HEAD_SHA
          git -C pr fetch --no-tags origin "$BASE_SHA"
          git -C pr diff --no-ext-diff --no-textconv --no-color "$BASE_SHA...HEAD" -- > "$RUNNER_TEMP/mention-pr.diff"
          python - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          temp = Path(os.environ["RUNNER_TEMP"])
          diff = (temp / "mention-pr.diff").read_text(errors="replace")
          limit = 100_000
          reference = f"Checked-out PR head: {os.environ['HEAD_SHA']}\n\n" + diff[:limit]
          if len(diff) > limit:
              reference += "\n\n[Diff truncated; inspect source files and report any review limitations.]\n"
          path = workspace / "pr/.engineer-mention-pr.diff"
          try:
              with path.open("x") as output:
                  output.write(reference)
          except FileExistsError:
              raise SystemExit("::error::PR diff reference path must not already exist.")
          path.chmod(0o444)
          PY
          printf '\n/.engineer-mention-pr.diff\n' >> pr/.git/info/exclude

      - name: Run engineer mention
        timeout-minutes: 30
        if: steps.pr.outputs.eligible == 'true'
        working-directory: pr
        env:
          GH_TOKEN: ${{ steps.prelude.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          ENGINEER_BOT_MODEL_OVERRIDE: databricks-claude-opus-5-5
          MODEL_ENDPOINT: https://${{ secrets.DATABRICKS_HOST }}/serving-endpoints/databricks-claude-opus-5-5/invocations
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          REPO_ROOT: ${{ github.workspace }}/pr
        run: |
          # The runner injects OIDC credentials per step; clear them in this shell.
          unset JFROG_ACCESS_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          python -m databricks_bot_engine.engineer_bot.run --phase mention \
            --bot "$GITHUB_WORKSPACE/.bot" \
            --system-prompt "$GITHUB_WORKSPACE/.bot/prompts/engineer-mention/system.md"
