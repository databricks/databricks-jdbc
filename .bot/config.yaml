# Engineer-bot task config for databricks-jdbc (the Databricks JDBC driver).
# Loaded by databricks_bot_engine.engineer_bot.bot_config.load_bot. The reviewer
# needs NO .bot/config.yaml (its prompts are engine-owned + the optional additive
# .bot/prompts/review/system.md); only the engineer-bot is config-driven.
name: databricks_jdbc_bugfix
marker_namespace: engineer-bot-jdbc
bot_login_prefix: peco-engineer-bot
max_replies_per_thread: 5

# branch_prefix / pr_title_template / commit_message_template are OMITTED: they
# are flow-aware templates, and the engine's per-flow defaults already match what
# we'd hardcode (bug-fix ⇒ branch `ai/bugfix-issue-`, title/commit `fix: …`).

# safe_path denylist (repo-relative). `.git/` and `.gitleaksignore` are ALWAYS
# denied by the engine regardless of this key. We ADD:
#   - .github/ — the workflows that run WITH the bot's tokens; a bug fix has no
#     business editing them, and hard-blocking them at the tool layer removes a
#     self-modification foothold.
#   - src/main/java/org/apache/arrow/ — the PATCHED Apache Arrow classes
#     (ArrowBuf.java, util/MemoryUtil.java, vector/util/DecimalUtility.java) that
#     spotless is configured to EXCLUDE from formatting; they are deliberate
#     vendored patches, not ordinary source, and a bug fix should not touch them.
# Everything else under the repo root stays writable; the human PR-review gate is
# the real safeguard. Reviewers MUST scrutinize any agent diff reaching pom.xml /
# jdbc-core/pom.xml / .github/ / the assembly modules, and note that a dependency
# change also requires a NEXT_CHANGELOG.md entry + NOTICE update.
denied_subpaths:
  - .github
  - src/main/java/org/apache/arrow

# Filled from the tracking ISSUE the maintainer labelled. (pr_body_template has no
# engine default, so it stays required here.)
pr_body_template: |-
  ## Summary

  Automated fix for [#{issue_number}]({issue_url}) — {issue_title}.

  {summary}

  ## Root cause & plan
  {plan}

  ## Files changed
  {files_changed}

  ## Test plan
  {test_plan}

  NO_CHANGELOG=true

  🤖 Generated by engineer-bot (bug-fix flow) — review before merge.

# Bash tool: argv-PREFIX allowlist (each entry is an exact prefix; args after it
# are model-supplied but constrained). Matching is `argv[:len(prefix)] == prefix`
# with shell=False (no shell metachar expansion). The allowlist IS the bash
# sandbox. The workflow runs `mvn install -DskipTests` ONCE before the agent
# (warms ~/.m2, compiles jdbc-core) and reverts spotless churn; these let the
# agent build/test/format after its edits:
#   - `mvn` — the agent's build/test/format. Typical uses:
#       mvn -pl jdbc-core test -Dtest=<Class>#<method>   (single unit/e2e test)
#       mvn -pl jdbc-core -am install -DskipTests         (recompile after an edit)
#       mvn spotless:apply                                (format its OWN edits —
#         REQUIRED before finishing; the compile-phase spotless:apply also runs on
#         any build, but an explicit apply guarantees the tree is formatted)
#     A single `mvn` prefix is intentional — Maven has no arbitrary-code goal
#     analogous to `python -c`; every goal is a declared plugin action, and the
#     runner is ephemeral + (after the pre-agent scrub) offline.
#   - `git status` — list changed files (generates no diff, takes no --output).
# `cat`, `ls`, `find`, and diff/log-GENERATING git subcommands are deliberately
# ABSENT — they read/write arbitrary absolute paths (the bash tool validates only
# the argv PREFIX). The agent has read_file / glob / grep for repo-relative,
# safe_path-contained reads.
bash_timeout: 1200
bash_allowlist:
  - [mvn]
  - [git, status]

# Author phase. The user prompt is ENGINE-RENDERED from the convention template
# .bot/prompts/engineer/user.md: {{token}} placeholders filled from env_tokens
# (the tracking issue's number/title/url, set by the workflow) and context_files
# (the issue body the workflow writes to a file).
author:
  env_tokens:
    issue_number: ISSUE_NUMBER
    issue_title: ISSUE_TITLE
    issue_url: ISSUE_URL
  context_files:
    - issue_body.txt   # {{issue_body}}

# Engine orchestration for the author phase. `bug-fix` runs the plan →
# author_tests → fix pipeline (write a failing test → fix the code → re-run to
# green) and forces the {outcome, reason, red_green_tests, out_of_scope}
# structured output that publish renders into the PR Test plan. The Java/Maven
# testing specifics (commands, layout, live e2e requirement, spotless) live in
# prompts/engineer/system.md, not here.
flow: bug-fix
